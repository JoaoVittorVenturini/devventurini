# Nginx — www.devventurini.com
# Copie para /etc/nginx/sites-available/devventurini e ative com:
#   sudo ln -s /etc/nginx/sites-available/devventurini /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Depois gere o HTTPS com:
#   sudo certbot --nginx -d devventurini.com -d www.devventurini.com
# (o certbot adiciona os blocos 443 e o redirecionamento http -> https sozinho)

# devventurini.com (sem www) -> www.devventurini.com
server {
    listen 80;
    listen [::]:80;
    server_name devventurini.com;
    return 301 $scheme://www.devventurini.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.devventurini.com;

    root /var/www/devventurini;
    index index.html;
    charset utf-8;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pasta só de configuração, não precisa ficar pública
    location ^~ /deploy/ { return 404; }
    location = /LEIA-ME.md { return 404; }

    # Cache longo para fontes e imagens, curto para o HTML
    location ~* \.(woff2|png|svg|ico|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.css$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css image/svg+xml application/manifest+json application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
